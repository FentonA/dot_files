{{Front}}

<div id="editor-container" style="width: 100%; height: 400px; border: 1px solid #ccc; position: relative;"></div>

<!-- Monaco Editor with Vim support -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

<script>
require.config({ 
    paths: { 
        'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs',
        'monaco-vim': 'https://unpkg.com/monaco-vim/dist/monaco-vim'
    }
});

require(['vs/editor/editor.main'], function() {
    window.editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: '',
        language: 'python',
        theme: 'vs-dark',
        fontSize: 14,
        fontFamily: 'Consolas, "Courier New", monospace',
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        automaticLayout: true,
        tabSize: 4,
        insertSpaces: true,
        wordWrap: 'off',
        bracketPairColorization: { enabled: true },
        autoIndent: 'full',
        formatOnPaste: true,
        formatOnType: true,
        quickSuggestions: false,
        suggestOnTriggerCharacters: false,
        acceptSuggestionOnEnter: 'off',
        tabCompletion: 'off',
        wordBasedSuggestions: false,
        parameterHints: { enabled: false },
        hover: { enabled: false }
    });
    
    // Store content globally for the back template to access
    function saveContent() {
        const content = editor.getValue();
        // Multiple storage methods to ensure persistence
        window.userAnswer = content;
        document.body.setAttribute('data-user-answer', content);
        
        // Try to store in sessionStorage
        try {
            sessionStorage.setItem('currentUserAnswer', content);
        } catch(e) {}
        
        return content;
    }
    
    // Load Vim mode
    require(['monaco-vim'], function(MonacoVim) {
        const vimMode = MonacoVim.initVimMode(editor, document.getElementById('vim-statusbar'));
        
        MonacoVim.VimMode.Vim.defineEx('ans', 'ans', function() {
            saveContent();
            if (typeof pycmd !== 'undefined') {
                pycmd('ans');
            }
        });
    });
    
    // Add keyboard shortcuts
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, function() {
        saveContent();
        if (typeof pycmd !== 'undefined') {
            pycmd('ans');
        }
    });
    
    // Force proper layout and positioning
    setTimeout(() => {
        editor.layout();
        editor.setValue('');
        editor.setPosition({ lineNumber: 1, column: 1 });
        editor.revealLine(1);
        editor.setScrollTop(0);
        editor.focus();
    }, 200);
    
    // Save content on every change
    editor.onDidChangeModelContent(saveContent);
});

// Global save before any navigation
window.addEventListener('beforeunload', function() {
    if (window.editor) {
        const content = window.editor.getValue();
        window.userAnswer = content;
        document.body.setAttribute('data-user-answer', content);
        try {
            sessionStorage.setItem('currentUserAnswer', content);
        } catch(e) {}
    }
});

// Global keyboard listener
document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (window.editor) {
            const content = window.editor.getValue();
            window.userAnswer = content;
            document.body.setAttribute('data-user-answer', content);
            try {
                sessionStorage.setItem('currentUserAnswer', content);
            } catch(e) {}
        }
        
        if (typeof pycmd !== 'undefined') {
            pycmd('ans');
        }
    }
});
</script>

<!-- Vim status bar -->
<div id="vim-statusbar" style="height: 20px; background: #1e1e1e; color: #fff; font-family: monospace; padding: 2px 8px; font-size: 12px;"></div>
