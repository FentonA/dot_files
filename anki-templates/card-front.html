{{Front}}

<div id="editor-container"></div>
<div id="vim-statusbar"></div>
<div id="card-meta" style="display:none" data-deck="{{Deck}}" data-type="{{Type}}"></div>

<script>
(function () {
  "use strict";

  // Anki reuses one webview for the whole review session, so nothing here may
  // declare a top-level const/let and nothing may be injected twice.
  var VS = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs';

  var host = document.getElementById('editor-container');
  var bar  = document.getElementById('vim-statusbar');
  var meta = document.getElementById('card-meta') || { dataset: {} };

  var deck = meta.dataset.deck || '';
  var type = meta.dataset.type || '';
  window.__ankiLang = /rust/i.test(type) || /rust/i.test(deck) ? 'rust' : 'python';

  // {{FrontSide}} re-runs this script on the answer side. Don't rebuild the
  // editor there — it would clear the answer we are about to diff.
  if (document.getElementById('answer')) {
    if (host) host.style.display = 'none';
    if (bar) bar.style.display = 'none';
    window.__ankiReveal = null;
    return;
  }

  window.__ankiUserAnswer = '';   // new question: forget the previous card's answer
  var built = false;

  function save() {
    var v = window.__ankiEditor ? window.__ankiEditor.getValue()
          : window.__ankiTextarea ? window.__ankiTextarea.value : '';
    window.__ankiUserAnswer = v;
    try { sessionStorage.setItem('ankiUserAnswer', v); } catch (e) {}
    return v;
  }

  function reveal() {
    save();
    if (typeof pycmd !== 'undefined') pycmd('ans');
  }
  window.__ankiReveal = reveal;

  // One global key hook for the session; it dispatches to the current card.
  if (!window.__ankiKeyHook) {
    window.__ankiKeyHook = true;
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && window.__ankiReveal) {
        e.preventDefault();
        window.__ankiReveal();
      }
    });
  }

  function status(msg) { if (bar) bar.textContent = msg; }

  function fallback(msg) {
    if (built) return;
    built = true;
    var ta = document.createElement('textarea');
    ta.id = 'fallback-editor';
    ta.spellcheck = false;
    host.appendChild(ta);
    window.__ankiEditor = null;
    window.__ankiTextarea = ta;
    ta.addEventListener('input', save);
    ta.focus();
    status(msg + ' — plain textarea, Ctrl+Enter to answer');
  }

  function attachVim(ed) {
    try {
      window.__ankiVim = window.MonacoVim.initVimMode(ed, bar);
      var Vim = window.MonacoVim.VimMode.Vim;
      Vim.defineEx('ans', 'ans', reveal);
      Vim.defineEx('write', 'w', reveal);
    } catch (e) {
      status('vim failed: ' + e);
    }
  }

  function loadVim(ed) {
    if (window.MonacoVim) return attachVim(ed);
    // monaco-vim's UMD build takes its AMD branch when `define` exists and then
    // asks for 'monaco-editor/esm/vs/editor/editor.api', which Monaco's own AMD
    // loader cannot resolve. Hide `define` so it takes the browser-global branch
    // and binds to window.monaco instead.
    var savedDefine = window.define;
    window.define = undefined;
    var s = document.createElement('script');
    s.src = '_monaco-vim.umd.js';
    s.onload = function () { window.define = savedDefine; attachVim(ed); };
    s.onerror = function () {
      window.define = savedDefine;
      status('_monaco-vim.umd.js missing from collection.media — no vim');
    };
    document.head.appendChild(s);
  }

  function createEditor() {
    if (built) return;
    built = true;

    if (window.__ankiVim) { try { window.__ankiVim.dispose(); } catch (e) {} }
    if (window.__ankiEditor) { try { window.__ankiEditor.dispose(); } catch (e) {} }
    window.__ankiVim = null;
    window.__ankiTextarea = null;

    var ed = monaco.editor.create(host, {
      value: '',
      language: window.__ankiLang,
      theme: 'vs-dark',
      fontSize: 14,
      fontFamily: '"JetBrains Mono", "Fira Code", Menlo, Consolas, monospace',
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      automaticLayout: true,
      tabSize: 4,
      insertSpaces: true,
      wordWrap: 'off',
      bracketPairColorization: { enabled: true },
      autoIndent: 'full',
      quickSuggestions: false,
      suggestOnTriggerCharacters: false,
      acceptSuggestionOnEnter: 'off',
      tabCompletion: 'off',
      wordBasedSuggestions: false,
      parameterHints: { enabled: false },
      hover: { enabled: false }
    });

    window.__ankiEditor = ed;
    ed.onDidChangeModelContent(save);
    ed.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, reveal);
    loadVim(ed);

    setTimeout(function () { ed.layout(); ed.focus(); }, 50);
  }

  function withMonaco(cb) {
    if (window.monaco && window.monaco.editor) return cb();

    (window.__ankiMonacoQueue = window.__ankiMonacoQueue || []).push(cb);
    if (window.__ankiMonacoLoading) return;
    window.__ankiMonacoLoading = true;

    function drain() {
      var q = window.__ankiMonacoQueue || [];
      window.__ankiMonacoQueue = [];
      q.forEach(function (f) { f(); });
    }

    var s = document.createElement('script');
    s.src = VS + '/loader.min.js';   // injected once per session; twice throws on _amdLoaderGlobal
    s.onload = function () {
      require.config({ paths: { vs: VS } });
      require(['vs/editor/editor.main'], drain);
    };
    s.onerror = function () {
      window.__ankiMonacoLoading = false;
      window.__ankiMonacoQueue = [];
      fallback('Monaco CDN unreachable');
    };
    document.head.appendChild(s);
  }

  withMonaco(createEditor);
  setTimeout(function () { fallback('Monaco timed out'); }, 6000);
})();
</script>
