# ~/.config/tmuxinator/swish.yml
#
# Swish Analytics. Refactored from the day-one scaffold now that the repo
# structure and workflow are known.
#
# What changed from the scaffold:
#   - Repos are separate uv projects, not one monorepo. One nvim per repo group.
#   - No local Kafka stack: Kafka is Confluent Cloud, reached over VPN.
#   - No local infra to docker-compose. VPN is the "stack" step.
#   - Added k8s window: kubectl/helm/argocd against EKS, namespace `deng`.
#   - Added db window: dadbod-ui + mycli/pgcli.
#   - Test loops are `uv run pytest`, not bare pytest.
#
# PREREQUISITE FOR ALMOST EVERYTHING: VPN connected.
#   Nexus package installs, all databases, Redis, Kafka, and the K8s API
#   are all VPN-gated. If something inexplicably hangs, check VPN first.

name: swish
root: ~/swish
tmux_options: -f ~/.config/tmux/.tmux.conf
pre_window: tmux set-window-option -g main-pane-width 70%
startup_window: props

windows:
  # ── ds_props: the main repo ───────────────────────────────────────────────
  # Four pipelines live here: main props, fast props, leaders/h2h, alternates.
  # This is where most work happens.
  - props:
      root: ~/swish/ds_props
      layout: main-vertical
      panes:
        - nvim .
        # Fast feedback loop. --testmon reruns only tests affected by changes.
        - # uv run pytest test/unit -q
        # Scratch: CLI runs, replay-event, ad-hoc queries
        - # uv run cli --help

  # ── ds_watcher: suspension monitoring ─────────────────────────────────────
  - watcher:
      root: ~/swish/ds_watcher
      layout: main-vertical
      panes:
        - nvim .
        - # uv run pytest test/unit -q
        - # uv run cli run-pregame-watcher

  # ── omaha: the rust services ──────────────────────────────────────────────
  # MBF API + alternates writer. Single nvim so rust-analyzer sees the whole
  # workspace; per-crate nvim breaks cross-crate goto-definition.
  - omaha:
      root: ~/swish/omaha
      layout: main-vertical
      panes:
        - nvim .
        # Scope the watcher once you know the crate layout:
        #   cargo watch -x 'test -p <crate>' -w <crate>/src
        - # cargo watch -x test
        # Benchmarking pane: criterion baselines, flamegraph
        - # cargo bench   /   cargo flamegraph --bin <bin>

  # ── bet-request + shared modules ──────────────────────────────────────────
  # Lower-traffic repos grouped into one window. Split out if one gets busy.
  - misc:
      root: ~/swish
      layout: main-vertical
      panes:
        - nvim cross-sports-bet-request-py
        - # cd cross-sports-bet-request-py && uv run pytest -q
        - # ds_functions / ds_constants / ds_lu_stat_type — read-mostly

  # ── k8s: cluster ops ──────────────────────────────────────────────────────
  # Namespace is `deng`. Clusters: ausw2.ds-main.* (props/sim/watcher/bet-request),
  # ausw2.ds-fgen.* (feature-gen), ausw2.deng.* (sport DE repos).
  # Refresh kubeconfigs with: k8s-access kubeconfig   (needs VPN + Docker)
  - k8s:
      root: ~/swish
      layout: main-horizontal
      panes:
        # Live pod watch. -w streams changes; drop it for a one-shot list.
        - # kubectl get pods -n deng -w
        # Ops pane: describe, logs, exec
        #   kubectl describe pod <pod> -n deng
        #   kubectl logs -f <pod> -n deng
        #   kubectl logs <pod> -n deng --previous     (crashed pod)
        #   kubectl exec -it <pod> -n deng -- /bin/bash
        - # ops
        # Scaling pane — this is the 90-day deliverable, keep it visible:
        #   kubectl get hpa -n deng
        #   kubectl describe hpa <name> -n deng
        #   kubectl top pods -n deng                  (needs metrics-server)
        #   kubectl scale deployment <name> -n deng --replicas=N
        - # scaling / hpa

  # ── aws ───────────────────────────────────────────────────────────────────
  # S3 for checkpoints, feature parquet, model artifacts. EKS for kubeconfigs.
  - aws:
      root: ~/swish
      layout: main-vertical
      panes:
        # Sanity check first thing: aws sts get-caller-identity
        - # aws sts get-caller-identity
        # Checkpoint browsing — the replay superpower lives here:
        #   aws s3 ls s3://swish-analytics-<sport>/ds_props/checkpoints/<env>/<event_id>/
        - # s3

  # ── db ────────────────────────────────────────────────────────────────────
  # dadbod-ui in nvim as primary; mycli/pgcli as the REPL fallback.
  # DBeaver stays installed for connection-profile sprawl across sport hosts.
  - db:
      root: ~/swish
      layout: main-vertical
      panes:
        # :DBUI  — connections defined in your dadbod config
        - nvim -c DBUI
        # mycli -h <sport>.pro.primary.db.swish.engineering -u <user>
        # pgcli for the AWS Postgres side
        - # mycli / pgcli

  # ── ci ────────────────────────────────────────────────────────────────────
  # Deploys run through GitHub Actions → ArgoCD.
  # ArgoCD UI: https://swish-argocd.swish-dso.pro.swishaws.engineering/applications
  - ci:
      root: ~/swish/ds_props
      layout: main-vertical
      panes:
        - nvim .github/workflows/
        - gh run list --limit 15 || true
        - # gh run watch <id> --exit-status ; gh run view <id> --log-failed

  # ── notes ─────────────────────────────────────────────────────────────────
  # The confusion list. Names, acronyms, "what is outboxing", the stuff that's
  # obvious by month two and unrecoverable in week one.
  - notes:
      root: ~/swish
      panes:
        - nvim ~/swish/NOTES.md
