# ~/.config/tmuxinator/swish.yml
#
# SCAFFOLD — written before day one, so every path below is a guess.
#
# Swish Analytics: python, rust, kafka, github actions. The window shape is real
# (it mirrors how clickk.yml splits editor / watcher / infra), but the roots and
# the commands marked TODO(day-one) are placeholders. This file is deliberately
# runnable *today* against an empty ~/swish so you can attach and iterate from
# inside the session instead of editing yaml blind.
#
# Day one, in rough order:
#   1. mkdir -p ~/swish && clone the repos into it
#   2. set each window's `root:` to the repo it belongs to (uncomment them)
#   3. replace the TODO(day-one) pane commands with the real test/run commands
#   4. delete any window that doesn't map to something real
#
# Why one nvim per language rather than per repo: if the rust side turns out to
# be a single cargo workspace, one nvim per crate means one rust-analyzer per
# crate and broken cross-crate goto-definition — the exact thing clickk.yml was
# reorganized to fix. Start grouped; split only if the repos are genuinely
# unrelated workspaces.

name: swish
root: ~/swish
tmux_options: -f ~/.config/tmux/.tmux.conf
pre_window: tmux set-window-option -g main-pane-width 70%
startup_window: py

windows:
  # ── python ────────────────────────────────────────────────────────────────
  # Point root at the python repo/subtree once you know it. Keeping nvim's cwd
  # at the project root (not a package dir) is what lets pyright/ruff find
  # pyproject.toml.
  - py:
      # root: ~/swish/<python-repo>
      layout: main-vertical
      panes:
        - nvim .
        # TODO(day-one): real test loop. Likely one of:
        #   pytest --testmon -q          (needs pytest-testmon)
        #   ptw -- -q                    (needs pytest-watch)
        #   uv run pytest -q
        - # test watcher

  # ── rust ──────────────────────────────────────────────────────────────────
  # `--poll` is in the clickk configs because watchers inside a bind-mounted
  # container miss inotify events. Drop it if you end up running cargo on the
  # host — polling burns CPU for no reason there.
  - rs:
      # root: ~/swish/<rust-repo>
      layout: main-vertical
      panes:
        - nvim .
        # TODO(day-one): scope this to the crates you touch, e.g.
        #   cargo watch -x 'test -p <crate>' -w <crate>/src
        # An unscoped watcher on a workspace rebuilds everything on every save
        # and takes a file lock on target/, queueing every other watcher behind it.
        - # cargo watch

  # ── kafka ─────────────────────────────────────────────────────────────────
  # Top pane for a long-lived consumer, bottom for one-off admin commands.
  # kcat is the fastest thing to reach for; the JVM kafka-* CLIs are the
  # fallback when you need consumer-group or ACL operations kcat can't do.
  - kafka:
      layout: main-horizontal
      panes:
        # TODO(day-one): tail whatever topic you live in, e.g.
        #   kcat -b $KAFKA_BROKERS -t <topic> -C -o end -J | jq .
        - # consumer
        # TODO(day-one): scratch pane for admin, e.g.
        #   kcat -b $KAFKA_BROKERS -L                       (list topics)
        #   kafka-consumer-groups --bootstrap-server $KAFKA_BROKERS --describe --group <g>
        - # admin

  # ── ci: github actions ────────────────────────────────────────────────────
  # `gh run watch` needs a run id and exits when it finishes, so it's a manual
  # command rather than a pane default. `gh run list` on attach is the useful
  # part — you see red before you start editing.
  - ci:
      layout: main-vertical
      panes:
        - nvim .github/workflows/
        - gh run list --limit 15 || true
        - # gh run watch <id> --exit-status ; gh run view <id> --log-failed

  # ── stack: local infra ────────────────────────────────────────────────────
  # Kafka locally is almost always a compose file (broker + schema registry, or
  # redpanda). Replace once you know which.
  - stack:
      layout: main-vertical
      panes:
        - # TODO(day-one): docker compose up  /  redpanda start
        - # shell

  # ── notes ─────────────────────────────────────────────────────────────────
  # Onboarding scratch: names, systems, acronyms, the stuff that's obvious by
  # month two and unrecoverable in week one.
  - notes:
      panes:
        - nvim ~/swish/NOTES.md
